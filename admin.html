<!DOCTYPE html>
<html>

<head>

<title>Admin Panel</title>

<style>

body{
background:black;
color:white;
font-family:Poppins;
padding:40px;
}

.review-card{
background:#111;
padding:20px;
margin-bottom:20px;
border-radius:20px;
}

button{
padding:10px 20px;
border:none;
border-radius:30px;
margin-top:10px;
cursor:pointer;
font-weight:bold;
}

.approve-btn{
background:#57f4e5;
}

.delete-btn{
background:red;
color:white;
}

img{
width:200px;
border-radius:15px;
margin-top:15px;
}

</style>

</head>

<body>

<h1>Admin Review Approval</h1>

<div id="reviewsContainer"></div>

<script>

async function loadPendingReviews(){

const response = await fetch(
"https://aeroventx.onrender.com/admin-reviews"
);

const reviews = await response.json();

const container =
document.getElementById("reviewsContainer");

container.innerHTML = "";

reviews.forEach(review=>{

container.innerHTML += `

<div class="review-card">

<h2>${review.name}</h2>

<p>${review.review}</p>

<p>⭐ ${review.rating}</p>

<img src="
https://aeroventx.onrender.com/uploads/${review.image}
">

<br>

<button
class="approve-btn"
onclick="approveReview('${review._id}')">

Approve

</button>

<button
class="delete-btn"
onclick="deleteReview('${review._id}')">

Delete

</button>

</div>

`;

});

}

async function approveReview(id){

await fetch(
`https://aeroventx.onrender.com/approve-review/${id}`,
{
method:"PUT"
});

loadPendingReviews();

}

async function deleteReview(id){

await fetch(
`https://aeroventx.onrender.com/delete-review/${id}`,
{
method:"DELETE"
});

loadPendingReviews();

}

loadPendingReviews();

</script>

</body>

</html>
