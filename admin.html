<!DOCTYPE html>
<html>

<head>

<title>Admin Panel</title>

<style>

body{
background:black;
color:white;
font-family:Poppins;
padding:40px;
}

h1{
margin-bottom:25px;
margin-top:40px;
}

.review-card{
background:#111;
padding:20px;
margin-bottom:20px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.1);
}

button{
padding:12px 22px;
border:none;
border-radius:30px;
margin-top:10px;
margin-right:10px;
cursor:pointer;
font-weight:bold;
}

.approve-btn{
background:#57f4e5;
color:black;
}

.delete-btn{
background:red;
color:white;
}

.logout-btn{
background:white;
color:black;
float:right;
}

input,
textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#111;
color:white;
}

textarea{
height:120px;
resize:none;
}

img{
width:200px;
border-radius:15px;
margin-top:15px;
}

hr{
margin:50px 0;
border:1px solid rgba(255,255,255,0.1);
}

</style>

</head>

<body>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

<h1>Admin Panel</h1>

<hr>

<h1>Add Service</h1>

<input
type="text"
id="serviceTitle"
placeholder="Service Title">

<textarea
id="serviceDescription"
placeholder="Service Description"></textarea>

<input
type="file"
id="serviceImage">

<button
class="approve-btn"
onclick="addService()">

Add Service

</button>

<hr>

<h1>Pending Reviews</h1>

<div id="reviewsContainer"></div>

<script>

if(!localStorage.getItem("adminToken")){

window.location.href =
"/admin-login.html";

}

/* LOAD PENDING REVIEWS */

async function loadPendingReviews(){

const response = await fetch(
"https://aeroventx.onrender.com/admin-reviews"
);

const reviews = await response.json();

const container =
document.getElementById("reviewsContainer");

container.innerHTML = "";

reviews.forEach(review=>{

container.innerHTML += `

<div class="review-card">

<h2>${review.name}</h2>

<p>${review.review}</p>

<p>⭐ ${review.rating}</p>

<img src="
https://aeroventx.onrender.com/uploads/${review.image}
">

<br>

<button
class="approve-btn"
onclick="approveReview('${review._id}')">

Approve

</button>

<button
class="delete-btn"
onclick="deleteReview('${review._id}')">

Delete

</button>

</div>

`;

});

}

/* APPROVE REVIEW */

async function approveReview(id){

await fetch(
`https://aeroventx.onrender.com/approve-review/${id}`,
{
method:"PUT"
});

loadPendingReviews();

}

/* DELETE REVIEW */

async function deleteReview(id){

await fetch(
`https://aeroventx.onrender.com/delete-review/${id}`,
{
method:"DELETE"
});

loadPendingReviews();

}

/* ADD SERVICE */

async function addService(){

const title =
document.getElementById("serviceTitle").value;

const description =
document.getElementById("serviceDescription").value;

const image =
document.getElementById("serviceImage").files[0];

const formData = new FormData();

formData.append("title",title);

formData.append("description",description);

formData.append("image",image);

try{

await fetch(
"https://aeroventx.onrender.com/add-service",
{
method:"POST",
body:formData
});

alert("Service Added Successfully");

document.getElementById("serviceTitle").value = "";

document.getElementById("serviceDescription").value = "";

document.getElementById("serviceImage").value = "";

}catch(error){

console.log(error);

alert("Failed To Add Service");

}

}

/* LOGOUT */

function logout(){

localStorage.removeItem(
"adminToken"
);

window.location.href =
"/admin-login.html";

}

/* INITIAL LOAD */

loadPendingReviews();

</script>

</body>

</html>
