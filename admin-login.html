<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<style>

body{
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Poppins;
}

.login-box{
background:#111;
padding:40px;
border-radius:20px;
width:350px;
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:12px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:30px;
background:#57f4e5;
font-weight:bold;
cursor:pointer;
}

h1{
color:white;
text-align:center;
margin-bottom:25px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<script>

async function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

const response = await fetch(
"https://aeroventx.onrender.com/admin-login",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

});

const data =
await response.json();

if(data.token){

localStorage.setItem(
"adminToken",
data.token
);

window.location.href =
"/admin.html";

}else{

alert(data.message);

}

}catch(error){

console.log(error);

alert("Login Failed");

}

}

</script>

</body>

</html>
