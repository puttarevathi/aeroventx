<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:url("image.jpeg");
            background-size:cover;
            background-position:center;
        }

        .box{
            width:360px;
            padding:40px;
            border-radius:15px;
            background:rgba(0,0,0,0.75);
            backdrop-filter:blur(8px);
            text-align:center;
            color:white;
        }

        h1{
            color:#00e5ff;
            margin-bottom:30px;
            font-size:40px;
        }

        input{
            width:100%;
            padding:14px;
            margin:12px 0;
            border:none;
            border-radius:10px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#00e5ff;
            color:black;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            margin-top:15px;
            transition:0.3s;
        }

        button:hover{
            background:white;
            transform:scale(1.03);
        }

        p{
            margin-top:20px;
            font-size:16px;
        }

        a{
            color:#00e5ff;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Login</h1>

    <input
        type="email"
        id="email"
        placeholder="Enter Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >

    <button onclick="login()">Login</button>

    <p>
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>

<script>

async function login(){

    // Get values
    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value.trim();



    // Empty validation
    if(email === "" || password === ""){

        alert("Please fill all fields");

        return;

    }



    // Email validation
    if(
        !email.endsWith("@gmail.com") &&
        !email.endsWith("@yahoo.com") &&
        !email.endsWith("@outlook.com")
    ){

        alert("Only Gmail, Yahoo, and Outlook emails are allowed");

        return;

    }



    // Password validation
    if(password.length < 6){

        alert("Password must be at least 6 characters");

        return;

    }



    // Create object
    const data = {

        email: email,

        password: password

    };



    try{

        // API request
        const response = await fetch(
            "https://aeroventx.onrender.com/login",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(data)

            }
        );



        // Convert response
        const result = await response.json();

        console.log(result);



        // SUCCESS
if(result.message === "Login Successful"){
            alert("Login Successful");

            // Redirect page
            window.location.href = "index.html";

        }

        // INVALID PASSWORD
        else{

            alert(result.message || "Invalid Email or Password");

        }

    }

    // SERVER ERROR
    catch(error){

        console.log(error);

        alert("Server Error! Please try again later.");

    }

}

</script>

</body>

</html>
